<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2456" />
      <stop offset="50%" stop-color="#9d1bb2" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#discGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Edge-to-edge frame accent -->
  <rect x="40" y="40" width="432" height="432" rx="40" fill="none" stroke="url(#bgGrad)" stroke-width="8" opacity="0.8"/>
  
  <!-- Vinyl / Waveform ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Music note with lightning snappy speed -->
  <path d="M220 160 L330 135 L330 270 A42 42 0 1 1 290 234 L290 190 L220 205 L220 310 A42 42 0 1 1 180 274 L180 160 Z" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Snappy flash badge -->
  <path d="M370 290 L340 340 L375 340 L345 400 L410 330 L375 330 Z" fill="#fbbf24"/>
</svg>
